name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Package distribution bundle
        run: |
          cd dist
          zip -r ../online-examination-management-${{ github.ref_name || 'latest' }}-dist.zip .
          cd ..
          sha256sum online-examination-management-${{ github.ref_name || 'latest' }}-dist.zip > checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            online-examination-management-${{ github.ref_name }}-dist.zip
            checksums.txt
          generate_release_notes: true
